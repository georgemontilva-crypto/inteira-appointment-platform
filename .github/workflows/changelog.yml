name: Auto Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    # Skip if the commit was made by this workflow itself
    if: "!contains(github.event.head_commit.message, 'chore: update changelog')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute new version and update changelog
        id: changelog
        run: |
          set -e

          # ── 1. Find latest tag (or fall back to first commit) ───────────────
          LAST_TAG=$(git tag --sort=-version:refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
            CURRENT_VERSION="1.0.0"
          else
            RANGE="${LAST_TAG}..HEAD"
            CURRENT_VERSION="${LAST_TAG#v}"
          fi

          echo "Last tag: ${LAST_TAG:-none}  |  current version: $CURRENT_VERSION"

          # ── 2. Read commits since last tag ──────────────────────────────────
          COMMITS=$(git log $RANGE --pretty=format:"%s" --no-merges)

          if [ -z "$COMMITS" ]; then
            echo "No new commits since last tag — skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ── 3. Classify bump type ────────────────────────────────────────────
          HAS_FEAT=false
          HAS_FIX=false

          while IFS= read -r msg; do
            if echo "$msg" | grep -qiE '^feat(\(.*\))?[!:]'; then
              HAS_FEAT=true
            elif echo "$msg" | grep -qiE '^fix(\(.*\))?[!:]'; then
              HAS_FIX=true
            fi
          done <<< "$COMMITS"

          # ── 4. Compute new semantic version ─────────────────────────────────
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          if [ "$HAS_FEAT" = "true" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$HAS_FIX" = "true" ]; then
            PATCH=$((PATCH + 1))
          else
            PATCH=$((PATCH + 1))   # any other commit still bumps patch
          fi
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TODAY=$(date -u +%Y-%m-%d)

          echo "New version: $NEW_VERSION  |  Date: $TODAY"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

          # ── 5. Build changes array entries ──────────────────────────────────
          CHANGES_JS=""
          while IFS= read -r msg; do
            # Escape single quotes and backslashes for JS string
            SAFE=$(echo "$msg" | sed "s/\\\\/\\\\\\\\/g" | sed "s/'/\\\\'/g")
            CHANGES_JS="${CHANGES_JS}      '${SAFE}',\n"
          done <<< "$COMMITS"
          # Remove trailing comma+newline from last entry
          CHANGES_JS=$(echo -e "$CHANGES_JS" | sed '$ s/,$//')

          # ── 6. Update client/src/data/changelog.ts ───────────────────────────
          CHANGELOG_FILE="client/src/data/changelog.ts"

          # Read current file
          CURRENT=$(cat "$CHANGELOG_FILE")

          # Replace APP_VERSION constant
          UPDATED=$(echo "$CURRENT" | sed "s/export const APP_VERSION = \".*\";/export const APP_VERSION = \"${NEW_VERSION}\";/")

          # Build new entry block
          NEW_ENTRY="  {\n    version: \"${NEW_VERSION}\",\n    date: \"${TODAY}\",\n    changes: [\n${CHANGES_JS}\n    ],\n  },"

          # Insert new entry at the start of the CHANGELOG array (after `[`)
          UPDATED=$(echo "$UPDATED" | sed "s/export const CHANGELOG = \[/export const CHANGELOG = [\n${NEW_ENTRY}/")

          echo "$UPDATED" > "$CHANGELOG_FILE"

          echo "Changelog updated:"
          head -30 "$CHANGELOG_FILE"

      - name: Tag new version
        if: steps.changelog.outputs.skip == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.changelog.outputs.new_version }}"

      - name: Commit and push changelog
        if: steps.changelog.outputs.skip == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/src/data/changelog.ts
          git commit -m "chore: update changelog to v${{ steps.changelog.outputs.new_version }}"
          git push origin main --follow-tags
